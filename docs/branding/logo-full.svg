<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160" role="img" aria-label="Rascals">
  <title>Rascals</title>

  <!-- mark on its dark tile -->
  <g transform="translate(16,0) scale(0.625)">
    <rect x="16" y="16" width="205" height="205" rx="46" fill="#0f0f14"/>
    <g transform="translate(28,28)">
      <!-- friend's bubble, behind -->
      <g fill="#7c6cff">
        <rect x="126" y="106" width="96" height="74" rx="26"/>
        <path d="M180 176 L180 212 L212 176 Z"/>
      </g>
      <!-- your bubble, front -->
      <g fill="#ffffff">
        <rect x="34" y="50" width="126" height="94" rx="32"/>
        <path d="M76 138 L76 186 L130 138 Z"/>
      </g>
      <!-- typing dots -->
      <circle cx="74" cy="97" r="9" fill="#101018"/>
      <circle cx="100" cy="97" r="9" fill="#101018"/>
      <circle cx="126" cy="97" r="9" fill="#101018"/>
    </g>
  </g>

  <!-- wordmark (system stack — SVG <img> can't load webfonts) -->
  <text x="212" y="106" font-family="ui-sans-serif, system-ui, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="82" font-weight="800" letter-spacing="-2" fill="#17181d">Rascals</text>
</svg>
