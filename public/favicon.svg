<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Rascals logo">
  <title>Rascals</title>
  <defs>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9b8bff"/>
      <stop offset="1" stop-color="#6b5cf0"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16161c"/>
      <stop offset="1" stop-color="#0a0a0e"/>
    </linearGradient>
  </defs>

  <!-- encrypted link between the two peers -->
  <path d="M96 96 L160 160" stroke="url(#purple)" stroke-width="30" stroke-linecap="round"/>

  <!-- peer A (you) -->
  <circle cx="96" cy="96" r="40" fill="url(#dark)" stroke="url(#purple)" stroke-width="10"/>
  <circle cx="96" cy="96" r="11" fill="url(#purple)"/>

  <!-- peer B (friend) -->
  <circle cx="160" cy="160" r="40" fill="url(#purple)"/>
  <circle cx="160" cy="160" r="14" fill="#0a0a0e"/>

  <!-- live / online status -->
  <circle cx="190" cy="130" r="20" fill="#3ddc84" opacity="0.18"/>
  <circle cx="190" cy="130" r="12" fill="#3ddc84"/>
</svg>
